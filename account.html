<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Account | MudduGumma Women's Wear</title>

  <style>
    *{
      box-sizing:border-box;
    }

    :root{
      --wine:#a90f48;
      --wine-dark:#780b35;
      --text:#38232d;
      --muted:#7b6a72;
      --line:#eadde1;
      --bg:#fff8f6;
      --card:#ffffff;
    }

    body{
      margin:0;
      min-height:100vh;
      font-family:Arial,sans-serif;
      background:
        radial-gradient(circle at 80% 10%, rgba(233,45,104,.08), transparent 30%),
        linear-gradient(135deg,#fffdfb,#fff5f2);
      color:var(--text);
    }

    header{
      min-height:80px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      padding:14px clamp(18px,6vw,80px);
      background:rgba(255,255,255,.94);
      border-bottom:1px solid var(--line);
      position:sticky;
      top:0;
      z-index:10;
    }

    .brand{
      text-decoration:none;
      color:var(--wine);
      font-size:26px;
      font-weight:800;
      letter-spacing:.02em;
    }

    .back{
      text-decoration:none;
      color:var(--wine);
      font-weight:700;
      font-size:14px;
    }

    main{
      width:min(1050px,calc(100% - 32px));
      margin:55px auto;
    }

    .account-card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:24px;
      box-shadow:0 18px 60px rgba(80,20,45,.08);
      overflow:hidden;
    }

    .account-top{
      padding:34px 34px 20px;
      text-align:center;
    }

    .account-top h1{
      margin:0 0 10px;
      color:var(--wine);
      font-size:clamp(30px,5vw,46px);
    }

    .account-top p{
      margin:0;
      color:var(--muted);
      line-height:1.6;
    }

    .tabs{
      display:flex;
      justify-content:center;
      gap:10px;
      padding:10px 24px 25px;
    }

    .tab-button{
      border:1px solid #ebced8;
      background:#fff;
      color:var(--wine);
      padding:12px 22px;
      border-radius:999px;
      font-weight:800;
      cursor:pointer;
    }

    .tab-button.active{
      background:var(--wine);
      color:#fff;
      border-color:var(--wine);
    }

    .panel{
      display:none;
      padding:0 34px 36px;
      max-width:650px;
      margin:auto;
    }

    .panel.active{
      display:block;
    }

    label{
      display:block;
      margin:16px 0 7px;
      font-size:14px;
      font-weight:700;
    }

    input{
      width:100%;
      padding:14px 15px;
      border:1px solid #dccfd4;
      border-radius:11px;
      outline:none;
      font-size:15px;
      background:#fff;
    }

    input:focus{
      border-color:var(--wine);
      box-shadow:0 0 0 3px rgba(169,15,72,.08);
    }

    .primary-button{
      width:100%;
      margin-top:22px;
      border:0;
      border-radius:11px;
      padding:15px;
      background:var(--wine);
      color:#fff;
      font-size:15px;
      font-weight:800;
      cursor:pointer;
    }

    .primary-button:hover{
      background:var(--wine-dark);
    }

    .primary-button:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    .message{
      min-height:22px;
      margin-top:14px;
      font-size:14px;
      text-align:center;
      line-height:1.5;
    }

    .message.error{
      color:#b32643;
    }

    .message.success{
      color:#247649;
    }

    .profile-wrap{
      display:none;
      padding:10px 34px 40px;
      max-width:720px;
      margin:auto;
    }

    .profile-wrap.active{
      display:block;
    }

    .profile-box{
      border:1px solid var(--line);
      background:#fffafc;
      border-radius:18px;
      padding:24px;
    }

    .profile-box h2{
      margin:0 0 18px;
      color:var(--wine);
    }

    .profile-row{
      display:grid;
      grid-template-columns:150px 1fr;
      gap:12px;
      padding:11px 0;
      border-bottom:1px solid #f0e5e9;
    }

    .profile-row:last-child{
      border-bottom:0;
    }

    .profile-label{
      font-weight:700;
      color:var(--muted);
    }

    .profile-actions{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      margin-top:22px;
    }

    .profile-actions a,
    .profile-actions button{
      border:0;
      border-radius:10px;
      padding:12px 18px;
      font-weight:800;
      cursor:pointer;
      text-decoration:none;
    }

    .continue-button{
      background:var(--wine);
      color:#fff;
    }

    .logout-button{
      background:#f4e9ed;
      color:var(--wine);
    }

    .loading{
      text-align:center;
      padding:45px;
      color:var(--muted);
    }

    .orders-section{
      margin-top:24px;
      border:1px solid var(--line);
      background:#fff;
      border-radius:18px;
      padding:24px;
    }

    .orders-title{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      margin-bottom:16px;
    }

    .orders-title h2{
      margin:0;
      color:var(--wine);
    }

    .orders-refresh{
      border:1px solid #ebced8;
      background:#fff7fa;
      color:var(--wine);
      border-radius:999px;
      padding:9px 14px;
      font-weight:800;
      cursor:pointer;
    }

    .orders-list{
      display:grid;
      gap:14px;
    }

    .order-card{
      border:1px solid var(--line);
      border-radius:14px;
      padding:18px;
      background:#fffafc;
    }

    .order-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:14px;
      margin-bottom:10px;
    }

    .order-id{
      font-weight:800;
      color:var(--text);
      overflow-wrap:anywhere;
    }

    .order-meta{
      margin-top:5px;
      color:var(--muted);
      font-size:13px;
    }

    .order-status{
      flex:0 0 auto;
      padding:6px 10px;
      border-radius:999px;
      background:#f3e8ed;
      color:var(--wine);
      font-size:12px;
      font-weight:800;
    }

    .order-status[data-status="paid"]{
      background:#e5f5eb;
      color:#247649;
    }

    .order-items{
      display:grid;
      gap:8px;
      padding-top:10px;
      border-top:1px solid #f0e5e9;
    }

    .order-item{
      display:flex;
      justify-content:space-between;
      gap:12px;
      color:var(--text);
      font-size:14px;
    }

    .order-empty{
      padding:24px 12px;
      text-align:center;
      color:var(--muted);
      line-height:1.5;
    }

    .order-empty.error{
      color:#b32643;
    }

    @media(max-width:650px){
      main{
        margin:28px auto;
      }

      .account-top,
      .panel,
      .profile-wrap{
        padding-left:20px;
        padding-right:20px;
      }

      .profile-row{
        grid-template-columns:1fr;
        gap:4px;
      }

      .tabs{
        flex-direction:column;
      }

      .tab-button{
        width:100%;
      }
    }
  
    /* Premium pastel boutique theme */
    :root{--wine:#8f4050;--wine-dark:#6f2e3c;--text:#43343a;--muted:#7e6c73;--line:rgba(143,64,80,.15);--bg:#fff7f6;--card:#fffdfb;--rose:#c9788b;--sage:#9aa78c;--gold:#b58a52}
    body{font-family:Montserrat,Arial,sans-serif;background:radial-gradient(circle at 84% 8%,rgba(154,167,140,.14),transparent 27%),radial-gradient(circle at 7% 86%,rgba(201,120,139,.13),transparent 29%),linear-gradient(135deg,#fffaf5,#fff1f4)}
    header{background:rgba(255,250,247,.94);border-color:var(--line);box-shadow:0 10px 35px rgba(82,48,58,.05);backdrop-filter:blur(12px)}
    .brand,.back,.account-top h1{color:var(--wine-dark)}
    .account-card{background:rgba(255,253,251,.94);border-color:var(--line);border-radius:28px;box-shadow:0 24px 70px rgba(82,48,58,.11)}
    .tab-button{border-color:rgba(143,64,80,.18);color:var(--wine);background:#fffaf9}
    .tab-button.active,.primary-button,button[type="submit"]{background:linear-gradient(135deg,var(--rose),var(--wine));border-color:transparent;box-shadow:0 10px 24px rgba(143,64,80,.16)}
    input,select,textarea{background:rgba(255,255,255,.9);border-color:rgba(143,64,80,.17);border-radius:12px}
    input:focus,select:focus,textarea:focus{border-color:var(--rose);box-shadow:0 0 0 4px rgba(201,120,139,.11);outline:none}
  

    .order-status[data-status="confirmed"],
    .order-status[data-status="packed"]{background:#fff1cf;color:#8a5a10}
    .order-status[data-status="shipped"],
    .order-status[data-status="out_for_delivery"]{background:#e5eefb;color:#285a91}
    .order-status[data-status="delivered"]{background:#ddf4e6;color:#17643a}
    .order-status[data-status="cancelled"]{background:#fde4e8;color:#a32840}
    .order-tracking{margin:12px 0 14px;padding:14px;border-radius:12px;background:#fff;border:1px solid #f0e5e9}
    .tracking-steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:10px}
    .tracking-step{height:6px;border-radius:999px;background:#eadfe3}
    .tracking-step.active{background:linear-gradient(90deg,var(--rose),var(--wine))}
    .tracking-copy{font-size:13px;color:var(--muted);line-height:1.55}
    .tracking-copy strong{color:var(--text)}
    @media(max-width:650px){
      .tracking-steps{grid-template-columns:repeat(3,1fr)}
    }

</style>
</head>

<body>

<header>
  <a class="brand" href="/">MudduGumma</a>
  <a class="back" href="/">← Back to Store</a>
</header>

<main>

  <div class="account-card">

    <div id="loadingState" class="loading">
      Checking your account...
    </div>

    <div id="guestArea" style="display:none;">

      <div class="account-top">
        <h1>Welcome to MudduGumma</h1>
        <p>
          Login to continue shopping, or create a new customer account.
        </p>
      </div>

      <div class="tabs">
        <button
          id="otpTab"
          class="tab-button active"
          type="button"
          onclick="showTab('otp')"
        >
          Mobile OTP
        </button>

        <button
          id="loginTab"
          class="tab-button"
          type="button"
          onclick="showTab('login')"
        >
          Password Login
        </button>

        <button
          id="registerTab"
          class="tab-button"
          type="button"
          onclick="showTab('register')"
        >
          Create Account
        </button>
      </div>

      <section id="otpPanel" class="panel active">
        <form id="otpForm">
          <label for="otpPhone">Mobile Number</label>
          <input
            id="otpPhone"
            type="tel"
            inputmode="numeric"
            maxlength="10"
            pattern="[6-9][0-9]{9}"
            autocomplete="tel"
            placeholder="10-digit Indian mobile number"
            required
          >

          <button id="sendOtpButton" class="primary-button" type="button">
            SEND OTP
          </button>

          <div id="otpCodeArea" style="display:none;">
            <label for="otpCode">Enter OTP</label>
            <input
              id="otpCode"
              type="text"
              inputmode="numeric"
              maxlength="8"
              autocomplete="one-time-code"
              placeholder="OTP received by SMS"
            >
            <button id="verifyOtpButton" class="primary-button" type="submit">
              VERIFY &amp; LOGIN
            </button>
          </div>

          <div id="otpMessage" class="message"></div>
        </form>
      </section>

      <section id="loginPanel" class="panel">

        <form id="loginForm">

          <label for="loginEmail">Email Address</label>
          <input
            id="loginEmail"
            type="email"
            autocomplete="email"
            required
          >

          <label for="loginPassword">Password</label>
          <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            minlength="8"
            required
          >

          <button
            id="loginButton"
            class="primary-button"
            type="submit"
          >
            LOGIN
          </button>

          <div id="loginMessage" class="message"></div>

        </form>

      </section>

      <section id="registerPanel" class="panel">

        <form id="registerForm">

          <label for="registerName">Full Name</label>
          <input
            id="registerName"
            type="text"
            autocomplete="name"
            required
          >

          <label for="registerPhone">Mobile Number</label>
          <input
            id="registerPhone"
            type="tel"
            inputmode="numeric"
            maxlength="10"
            pattern="[0-9]{10}"
            autocomplete="tel"
            required
          >

          <label for="registerEmail">Email Address</label>
          <input
            id="registerEmail"
            type="email"
            autocomplete="email"
            required
          >

          <label for="registerPassword">
            Password
          </label>
          <input
            id="registerPassword"
            type="password"
            minlength="8"
            autocomplete="new-password"
            required
          >

          <label for="registerConfirmPassword">
            Confirm Password
          </label>
          <input
            id="registerConfirmPassword"
            type="password"
            minlength="8"
            autocomplete="new-password"
            required
          >

          <button
            id="registerButton"
            class="primary-button"
            type="submit"
          >
            CREATE ACCOUNT
          </button>

          <div id="registerMessage" class="message"></div>

        </form>

      </section>

    </div>

    <div id="profileArea" class="profile-wrap">

      <div class="account-top" style="padding-left:0;padding-right:0;">
        <h1>My Account</h1>
        <p>You are logged in to MudduGumma.</p>
      </div>

      <div class="profile-box">

        <h2 id="welcomeName">Welcome</h2>

        <div class="profile-row">
          <div class="profile-label">Name</div>
          <div id="profileName">-</div>
        </div>

        <div class="profile-row">
          <div class="profile-label">Email</div>
          <div id="profileEmail">-</div>
        </div>

        <div class="profile-row">
          <div class="profile-label">Mobile</div>
          <div id="profilePhone">-</div>
        </div>

        <div class="profile-actions">

          <a
            id="continueLink"
            class="continue-button"
            href="/"
          >
            Continue Shopping
          </a>

          <button
            class="logout-button"
            type="button"
            onclick="logoutCustomer()"
          >
            Logout
          </button>

        </div>

        <div id="profileMessage" class="message"></div>

      </div>

      <section class="orders-section" aria-labelledby="ordersHeading">
        <div class="orders-title">
          <h2 id="ordersHeading">My Orders</h2>
          <button
            class="orders-refresh"
            type="button"
            onclick="loadCustomerOrders()"
          >
            Refresh
          </button>
        </div>

        <div id="ordersList" class="orders-list" aria-live="polite">
          <div class="order-empty">Loading your orders...</div>
        </div>
      </section>
    </div>

  </div>

</main>

<script>
  function safeNextUrl() {
    const params =
      new URLSearchParams(
        window.location.search
      );

    const next =
      String(
        params.get("next") || ""
      );

    if (
      next.startsWith("/") &&
      !next.startsWith("//")
    ) {
      return next;
    }

    return "";
  }


  function showTab(tab) {
    ["otp", "login", "register"]
      .forEach(name => {
        document
          .getElementById(name + "Tab")
          .classList
          .toggle("active", tab === name);

        document
          .getElementById(name + "Panel")
          .classList
          .toggle("active", tab === name);
      });
  }


  function setMessage(
    elementId,
    text,
    type
  ) {

    const element =
      document.getElementById(
        elementId
      );

    element.textContent =
      text || "";

    element.className =
      "message " + (type || "");
  }


  function showGuest() {

    document
      .getElementById("loadingState")
      .style.display =
        "none";

    document
      .getElementById("guestArea")
      .style.display =
        "block";

    document
      .getElementById("profileArea")
      .classList
      .remove("active");
  }


  function formatRupees(value) {
    const amount = Number(value || 0);

    return "₹" +
      amount.toLocaleString("en-IN", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
  }


  function formatOrderDate(value) {
    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
      return "Date unavailable";
    }

    return date.toLocaleString("en-IN", {
      dateStyle: "medium",
      timeStyle: "short"
    });
  }


  function orderStatusText(value) {
    const status =
      String(value || "created")
        .replace(/_/g, " ");

    return status.charAt(0).toUpperCase() +
      status.slice(1);
  }



  function orderProgressIndex(value) {
    const stages = [
      "paid",
      "confirmed",
      "packed",
      "shipped",
      "out_for_delivery",
      "delivered"
    ];
    const index = stages.indexOf(
      String(value || "").toLowerCase()
    );
    return index < 0 ? 0 : index;
  }


  function showOrdersMessage(text, type) {
    const list =
      document.getElementById("ordersList");

    const message =
      document.createElement("div");

    message.className =
      "order-empty" +
      (type === "error" ? " error" : "");

    message.textContent = text;
    list.replaceChildren(message);
  }


  function renderCustomerOrders(orders) {
    const list =
      document.getElementById("ordersList");

    list.replaceChildren();

    if (!Array.isArray(orders) || !orders.length) {
      showOrdersMessage(
        "You have not placed any orders yet.",
        ""
      );
      return;
    }

    orders.forEach(order => {
      const card =
        document.createElement("article");
      card.className = "order-card";

      const head =
        document.createElement("div");
      head.className = "order-head";

      const details =
        document.createElement("div");

      const id =
        document.createElement("div");
      id.className = "order-id";
      id.textContent =
        "Order #" + String(order.id || "-");

      const meta =
        document.createElement("div");
      meta.className = "order-meta";
      meta.textContent =
        formatOrderDate(order.createdAt) +
        " · Total " +
        formatRupees(order.amount);

      details.append(id, meta);

      const status =
        document.createElement("span");
      status.className = "order-status";
      status.dataset.status =
        String(order.status || "created")
          .toLowerCase();
      status.textContent =
        orderStatusText(order.status);

      head.append(details, status);
      card.append(head);


      const tracking =
        document.createElement("div");
      tracking.className = "order-tracking";

      const steps =
        document.createElement("div");
      steps.className = "tracking-steps";

      const currentProgress =
        orderProgressIndex(order.status);

      for (let stepIndex = 0; stepIndex < 6; stepIndex += 1) {
        const step = document.createElement("span");
        step.className =
          "tracking-step" +
          (stepIndex <= currentProgress ? " active" : "");
        steps.append(step);
      }

      const trackingCopy =
        document.createElement("div");
      trackingCopy.className = "tracking-copy";

      const statusLine =
        document.createElement("strong");
      statusLine.textContent =
        String(order.status || "").toLowerCase() === "cancelled"
          ? "This order was cancelled."
          : "Current stage: " + orderStatusText(order.status);

      trackingCopy.append(statusLine);

      const relevantDate =
        order.deliveredAt ||
        order.statusUpdatedAt ||
        order.paidAt;

      if (relevantDate) {
        trackingCopy.append(
          document.createElement("br"),
          document.createTextNode(
            (order.deliveredAt ? "Delivered: " : "Last updated: ") +
            formatOrderDate(relevantDate)
          )
        );
      }

      if (order.trackingNote) {
        trackingCopy.append(
          document.createElement("br"),
          document.createTextNode(order.trackingNote)
        );
      }

      tracking.append(steps, trackingCopy);
      card.append(tracking);

      const itemsWrap =
        document.createElement("div");
      itemsWrap.className = "order-items";

      const items =
        Array.isArray(order.items)
          ? order.items
          : [];

      if (!items.length) {
        const item =
          document.createElement("div");
        item.className = "order-item";
        item.textContent =
          "No item details available.";
        itemsWrap.append(item);
      } else {
        items.forEach(orderItem => {
          const row =
            document.createElement("div");
          row.className = "order-item";

          const name =
            document.createElement("span");
          const quantity =
            Math.max(
              1,
              Number(orderItem.quantity || 1)
            );
          const variantText =
            [
              orderItem.color
                ? "Color: " + orderItem.color
                : "",
              orderItem.size
                ? "Size: " + orderItem.size
                : ""
            ]
              .filter(Boolean)
              .join(" · ");

          name.textContent =
            String(orderItem.name || "Item") +
            " × " + quantity +
            (variantText ? " — " + variantText : "");

          const price =
            document.createElement("strong");
          price.textContent =
            formatRupees(
              Number(orderItem.price || 0) *
              quantity
            );

          row.append(name, price);
          itemsWrap.append(row);
        });
      }

      card.append(itemsWrap);
      list.append(card);
    });
  }


  async function loadCustomerOrders() {
    showOrdersMessage("Loading your orders...", "");

    try {
      const response =
        await fetch("/api/customer/orders", {
          credentials: "same-origin"
        });

      const data =
        await response.json();

      if (!response.ok) {
        throw new Error(
          data.error ||
          "Could not load your orders."
        );
      }

      renderCustomerOrders(data.orders);
    } catch (error) {
      console.error(error);
      showOrdersMessage(
        error.message ||
          "Could not load your orders.",
        "error"
      );
    }
  }

  function showProfile(customer) {

    document
      .getElementById("loadingState")
      .style.display =
        "none";

    document
      .getElementById("guestArea")
      .style.display =
        "none";

    document
      .getElementById("profileArea")
      .classList
      .add("active");

    document
      .getElementById("welcomeName")
      .textContent =
        "Welcome, " +
        (customer.name || "Customer");

    document
      .getElementById("profileName")
      .textContent =
        customer.name || "-";

    document
      .getElementById("profileEmail")
      .textContent =
        customer.email || "-";

    document
      .getElementById("profilePhone")
      .textContent =
        customer.phone || "-";

    const next =
      safeNextUrl();

    const link =
      document.getElementById(
        "continueLink"
      );

    if (next) {
      link.href =
        next;

      link.textContent =
        "Continue to Checkout";
    } else {
      link.href =
        "/";

      link.textContent =
        "Continue Shopping";
    }

    loadCustomerOrders();
  }


  async function checkCustomer() {

    try {

      const response =
        await fetch(
          "/api/customer/me",
          {
            credentials:
              "same-origin"
          }
        );

      const data =
        await response.json();

      if (
        response.ok &&
        data.authenticated &&
        data.customer
      ) {

        showProfile(
          data.customer
        );

        return;
      }

    } catch (error) {
      console.error(error);
    }

    showGuest();
  }


  let otpWidgetReady = false;


  async function initializeOtpWidget() {
    try {
      const response = await fetch("/api/customer/otp-config", {
        credentials: "same-origin"
      });
      const config = await response.json();

      if (!response.ok) {
        throw new Error(config.error || "SMS OTP is unavailable.");
      }

      window.mgOtpConfiguration = {
        widgetId: config.widgetId,
        tokenAuth: config.tokenAuth,
        exposeMethods: true,
        success: function() {},
        failure: function(error) {
          console.error("MSG91 OTP error", error);
        }
      };

      const script = document.createElement("script");
      script.src = "https://verify.msg91.com/otp-provider.js";
      script.async = true;
      script.onload = function() {
        window.initSendOTP(window.mgOtpConfiguration);
        otpWidgetReady = true;
      };
      script.onerror = function() {
        setMessage("otpMessage", "Could not load SMS OTP. Please try again.", "error");
      };
      document.head.appendChild(script);
    } catch (error) {
      setMessage("otpMessage", error.message || "SMS OTP is unavailable.", "error");
    }
  }


  function otpAccessToken(data) {
    if (typeof data === "string") return data;
    if (!data || typeof data !== "object") return "";

    return String(
      data.accessToken ||
      data.access_token ||
      data["access-token"] ||
      data.message ||
      (data.data && (
        data.data.accessToken ||
        data.data.access_token ||
        data.data["access-token"] ||
        data.data.message
      )) ||
      ""
    );
  }


  document
    .getElementById("sendOtpButton")
    .addEventListener("click", function() {
      const phone = document.getElementById("otpPhone").value.replace(/\D/g, "");

      if (!/^[6-9][0-9]{9}$/.test(phone)) {
        setMessage("otpMessage", "Please enter a valid 10-digit Indian mobile number.", "error");
        return;
      }

      if (!otpWidgetReady || typeof window.sendOtp !== "function") {
        setMessage("otpMessage", "SMS OTP is still loading. Please try again in a moment.", "error");
        return;
      }

      const button = document.getElementById("sendOtpButton");
      button.disabled = true;
      button.textContent = "SENDING OTP...";
      setMessage("otpMessage", "", "");

      window.sendOtp(
        "91" + phone,
        function() {
          document.getElementById("otpCodeArea").style.display = "block";
          document.getElementById("otpCode").focus();
          setMessage("otpMessage", "OTP sent to your mobile number.", "success");
          button.textContent = "RESEND OTP";
          button.disabled = false;
        },
        function(error) {
          console.error(error);
          setMessage("otpMessage", "Could not send OTP. Check the number and try again.", "error");
          button.textContent = "SEND OTP";
          button.disabled = false;
        }
      );
    });


  document
    .getElementById("otpForm")
    .addEventListener("submit", function(event) {
      event.preventDefault();

      const otp = document.getElementById("otpCode").value.trim();
      const phone = document.getElementById("otpPhone").value.replace(/\D/g, "");
      const button = document.getElementById("verifyOtpButton");

      if (!otp || typeof window.verifyOtp !== "function") {
        setMessage("otpMessage", "Please enter the OTP received by SMS.", "error");
        return;
      }

      button.disabled = true;
      button.textContent = "VERIFYING...";

      window.verifyOtp(
        otp,
        async function(result) {
          try {
            const accessToken = otpAccessToken(result);
            if (!accessToken) throw new Error("MSG91 did not return a verification token.");

            const response = await fetch("/api/customer/otp-login", {
              method: "POST",
              credentials: "same-origin",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ phone, accessToken })
            });
            const data = await response.json();

            if (!response.ok) throw new Error(data.error || "OTP login failed.");

            const next = safeNextUrl();
            if (next) {
              window.location.href = next;
              return;
            }

            showProfile(data.customer);
          } catch (error) {
            setMessage("otpMessage", error.message || "OTP login failed.", "error");
            button.disabled = false;
            button.textContent = "VERIFY & LOGIN";
          }
        },
        function(error) {
          console.error(error);
          setMessage("otpMessage", "The OTP is incorrect or expired. Please try again.", "error");
          button.disabled = false;
          button.textContent = "VERIFY & LOGIN";
        }
      );
    });


  document
    .getElementById("loginForm")
    .addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const button =
          document.getElementById(
            "loginButton"
          );

        setMessage(
          "loginMessage",
          "",
          ""
        );

        button.disabled =
          true;

        button.textContent =
          "LOGGING IN...";

        try {

          const response =
            await fetch(
              "/api/customer/login",
              {
                method:
                  "POST",

                credentials:
                  "same-origin",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    email:
                      document
                        .getElementById(
                          "loginEmail"
                        )
                        .value
                        .trim(),

                    password:
                      document
                        .getElementById(
                          "loginPassword"
                        )
                        .value
                  })
              }
            );

          const data =
            await response.json();

          if (!response.ok) {
            throw new Error(
              data.error ||
              "Login failed."
            );
          }

          const next =
            safeNextUrl();

          if (next) {
            window.location.href =
              next;

            return;
          }

          showProfile(
            data.customer
          );

        } catch (error) {

          setMessage(
            "loginMessage",
            error.message ||
              "Login failed.",
            "error"
          );

        } finally {

          button.disabled =
            false;

          button.textContent =
            "LOGIN";
        }
      }
    );


  document
    .getElementById("registerForm")
    .addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const password =
          document
            .getElementById(
              "registerPassword"
            )
            .value;

        const confirmPassword =
          document
            .getElementById(
              "registerConfirmPassword"
            )
            .value;

        if (
          password !==
          confirmPassword
        ) {

          setMessage(
            "registerMessage",
            "Passwords do not match.",
            "error"
          );

          return;
        }

        const button =
          document.getElementById(
            "registerButton"
          );

        setMessage(
          "registerMessage",
          "",
          ""
        );

        button.disabled =
          true;

        button.textContent =
          "CREATING ACCOUNT...";

        try {

          const response =
            await fetch(
              "/api/customer/register",
              {
                method:
                  "POST",

                credentials:
                  "same-origin",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    name:
                      document
                        .getElementById(
                          "registerName"
                        )
                        .value
                        .trim(),

                    phone:
                      document
                        .getElementById(
                          "registerPhone"
                        )
                        .value
                        .trim(),

                    email:
                      document
                        .getElementById(
                          "registerEmail"
                        )
                        .value
                        .trim(),

                    password:
                      password
                  })
              }
            );

          const data =
            await response.json();

          if (!response.ok) {
            throw new Error(
              data.error ||
              "Could not create account."
            );
          }

          const next =
            safeNextUrl();

          if (next) {
            window.location.href =
              next;

            return;
          }

          showProfile(
            data.customer
          );

        } catch (error) {

          setMessage(
            "registerMessage",
            error.message ||
              "Could not create account.",
            "error"
          );

        } finally {

          button.disabled =
            false;

          button.textContent =
            "CREATE ACCOUNT";
        }
      }
    );


  async function logoutCustomer() {

    setMessage(
      "profileMessage",
      "Logging out...",
      ""
    );

    try {

      await fetch(
        "/api/customer/logout",
        {
          method:
            "POST",

          credentials:
            "same-origin"
        }
      );

    } catch (error) {
      console.error(error);
    }

    window.location.href =
      "/account.html";
  }


  initializeOtpWidget();
  checkCustomer();
</script>

</body>
</html>
