<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Account | MudduGumma Women's Wear</title>

  <style>
    *{
      box-sizing:border-box;
    }

    :root{
      --wine:#a90f48;
      --wine-dark:#780b35;
      --text:#38232d;
      --muted:#7b6a72;
      --line:#eadde1;
      --bg:#fff8f6;
      --card:#ffffff;
    }

    body{
      margin:0;
      min-height:100vh;
      font-family:Arial,sans-serif;
      background:
        radial-gradient(circle at 80% 10%, rgba(233,45,104,.08), transparent 30%),
        linear-gradient(135deg,#fffdfb,#fff5f2);
      color:var(--text);
    }

    header{
      min-height:80px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      padding:14px clamp(18px,6vw,80px);
      background:rgba(255,255,255,.94);
      border-bottom:1px solid var(--line);
      position:sticky;
      top:0;
      z-index:10;
    }

    .brand{
      text-decoration:none;
      color:var(--wine);
      font-size:26px;
      font-weight:800;
      letter-spacing:.02em;
    }

    .back{
      text-decoration:none;
      color:var(--wine);
      font-weight:700;
      font-size:14px;
    }

    main{
      width:min(1050px,calc(100% - 32px));
      margin:55px auto;
    }

    .account-card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:24px;
      box-shadow:0 18px 60px rgba(80,20,45,.08);
      overflow:hidden;
    }

    .account-top{
      padding:34px 34px 20px;
      text-align:center;
    }

    .account-top h1{
      margin:0 0 10px;
      color:var(--wine);
      font-size:clamp(30px,5vw,46px);
    }

    .account-top p{
      margin:0;
      color:var(--muted);
      line-height:1.6;
    }

    .tabs{
      display:flex;
      justify-content:center;
      gap:10px;
      padding:10px 24px 25px;
    }

    .tab-button{
      border:1px solid #ebced8;
      background:#fff;
      color:var(--wine);
      padding:12px 22px;
      border-radius:999px;
      font-weight:800;
      cursor:pointer;
    }

    .tab-button.active{
      background:var(--wine);
      color:#fff;
      border-color:var(--wine);
    }

    .panel{
      display:none;
      padding:0 34px 36px;
      max-width:650px;
      margin:auto;
    }

    .panel.active{
      display:block;
    }

    label{
      display:block;
      margin:16px 0 7px;
      font-size:14px;
      font-weight:700;
    }

    input{
      width:100%;
      padding:14px 15px;
      border:1px solid #dccfd4;
      border-radius:11px;
      outline:none;
      font-size:15px;
      background:#fff;
    }

    input:focus{
      border-color:var(--wine);
      box-shadow:0 0 0 3px rgba(169,15,72,.08);
    }

    .primary-button{
      width:100%;
      margin-top:22px;
      border:0;
      border-radius:11px;
      padding:15px;
      background:var(--wine);
      color:#fff;
      font-size:15px;
      font-weight:800;
      cursor:pointer;
    }

    .primary-button:hover{
      background:var(--wine-dark);
    }

    .primary-button:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    .message{
      min-height:22px;
      margin-top:14px;
      font-size:14px;
      text-align:center;
      line-height:1.5;
    }

    .message.error{
      color:#b32643;
    }

    .message.success{
      color:#247649;
    }

    .profile-wrap{
      display:none;
      padding:10px 34px 40px;
      max-width:720px;
      margin:auto;
    }

    .profile-wrap.active{
      display:block;
    }

    .profile-box{
      border:1px solid var(--line);
      background:#fffafc;
      border-radius:18px;
      padding:24px;
    }

    .profile-box h2{
      margin:0 0 18px;
      color:var(--wine);
    }

    .profile-row{
      display:grid;
      grid-template-columns:150px 1fr;
      gap:12px;
      padding:11px 0;
      border-bottom:1px solid #f0e5e9;
    }

    .profile-row:last-child{
      border-bottom:0;
    }

    .profile-label{
      font-weight:700;
      color:var(--muted);
    }

    .profile-actions{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      margin-top:22px;
    }

    .profile-actions a,
    .profile-actions button{
      border:0;
      border-radius:10px;
      padding:12px 18px;
      font-weight:800;
      cursor:pointer;
      text-decoration:none;
    }

    .continue-button{
      background:var(--wine);
      color:#fff;
    }

    .logout-button{
      background:#f4e9ed;
      color:var(--wine);
    }

    .loading{
      text-align:center;
      padding:45px;
      color:var(--muted);
    }

    .orders-section{
      margin-top:24px;
      border:1px solid var(--line);
      background:#fff;
      border-radius:18px;
      padding:24px;
    }

    .orders-title{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      margin-bottom:16px;
    }

    .orders-title h2{
      margin:0;
      color:var(--wine);
    }

    .orders-refresh{
      border:1px solid #ebced8;
      background:#fff7fa;
      color:var(--wine);
      border-radius:999px;
      padding:9px 14px;
      font-weight:800;
      cursor:pointer;
    }

    .orders-list{
      display:grid;
      gap:14px;
    }

    .order-card{
      border:1px solid var(--line);
      border-radius:14px;
      padding:18px;
      background:#fffafc;
    }

    .order-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:14px;
      margin-bottom:10px;
    }

    .order-id{
      font-weight:800;
      color:var(--text);
      overflow-wrap:anywhere;
    }

    .order-meta{
      margin-top:5px;
      color:var(--muted);
      font-size:13px;
    }

    .order-status{
      flex:0 0 auto;
      padding:6px 10px;
      border-radius:999px;
      background:#f3e8ed;
      color:var(--wine);
      font-size:12px;
      font-weight:800;
    }

    .order-status[data-status="paid"]{
      background:#e5f5eb;
      color:#247649;
    }

    .order-items{
      display:grid;
      gap:8px;
      padding-top:10px;
      border-top:1px solid #f0e5e9;
    }

    .order-item{
      display:flex;
      justify-content:space-between;
      gap:12px;
      color:var(--text);
      font-size:14px;
    }

    .order-empty{
      padding:24px 12px;
      text-align:center;
      color:var(--muted);
      line-height:1.5;
    }

    .order-empty.error{
      color:#b32643;
    }

    @media(max-width:650px){
      main{
        margin:28px auto;
      }

      .account-top,
      .panel,
      .profile-wrap{
        padding-left:20px;
        padding-right:20px;
      }

      .profile-row{
        grid-template-columns:1fr;
        gap:4px;
      }

      .tabs{
        flex-direction:column;
      }

      .tab-button{
        width:100%;
      }
    }
  </style>
</head>

<body>

<header>
  <a class="brand" href="/">MudduGumma</a>
  <a class="back" href="/">← Back to Store</a>
</header>

<main>

  <div class="account-card">

    <div id="loadingState" class="loading">
      Checking your account...
    </div>

    <div id="guestArea" style="display:none;">

      <div class="account-top">
        <h1>Welcome to MudduGumma</h1>
        <p>
          Login to continue shopping, or create a new customer account.
        </p>
      </div>

      <div class="tabs">
        <button
          id="loginTab"
          class="tab-button active"
          type="button"
          onclick="showTab('login')"
        >
          Login
        </button>

        <button
          id="registerTab"
          class="tab-button"
          type="button"
          onclick="showTab('register')"
        >
          Create Account
        </button>
      </div>

      <section id="loginPanel" class="panel active">

        <form id="loginForm">

          <label for="loginEmail">Email Address</label>
          <input
            id="loginEmail"
            type="email"
            autocomplete="email"
            required
          >

          <label for="loginPassword">Password</label>
          <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            minlength="8"
            required
          >

          <button
            id="loginButton"
            class="primary-button"
            type="submit"
          >
            LOGIN
          </button>

          <div id="loginMessage" class="message"></div>

        </form>

      </section>

      <section id="registerPanel" class="panel">

        <form id="registerForm">

          <label for="registerName">Full Name</label>
          <input
            id="registerName"
            type="text"
            autocomplete="name"
            required
          >

          <label for="registerPhone">Mobile Number</label>
          <input
            id="registerPhone"
            type="tel"
            inputmode="numeric"
            maxlength="10"
            pattern="[0-9]{10}"
            autocomplete="tel"
            required
          >

          <label for="registerEmail">Email Address</label>
          <input
            id="registerEmail"
            type="email"
            autocomplete="email"
            required
          >

          <label for="registerPassword">
            Password
          </label>
          <input
            id="registerPassword"
            type="password"
            minlength="8"
            autocomplete="new-password"
            required
          >

          <label for="registerConfirmPassword">
            Confirm Password
          </label>
          <input
            id="registerConfirmPassword"
            type="password"
            minlength="8"
            autocomplete="new-password"
            required
          >

          <button
            id="registerButton"
            class="primary-button"
            type="submit"
          >
            CREATE ACCOUNT
          </button>

          <div id="registerMessage" class="message"></div>

        </form>

      </section>

    </div>

    <div id="profileArea" class="profile-wrap">

      <div class="account-top" style="padding-left:0;padding-right:0;">
        <h1>My Account</h1>
        <p>You are logged in to MudduGumma.</p>
      </div>

      <div class="profile-box">

        <h2 id="welcomeName">Welcome</h2>

        <div class="profile-row">
          <div class="profile-label">Name</div>
          <div id="profileName">-</div>
        </div>

        <div class="profile-row">
          <div class="profile-label">Email</div>
          <div id="profileEmail">-</div>
        </div>

        <div class="profile-row">
          <div class="profile-label">Mobile</div>
          <div id="profilePhone">-</div>
        </div>

        <div class="profile-actions">

          <a
            id="continueLink"
            class="continue-button"
            href="/"
          >
            Continue Shopping
          </a>

          <button
            class="logout-button"
            type="button"
            onclick="logoutCustomer()"
          >
            Logout
          </button>

        </div>

        <div id="profileMessage" class="message"></div>

      </div>

      <section class="orders-section" aria-labelledby="ordersHeading">
        <div class="orders-title">
          <h2 id="ordersHeading">My Orders</h2>
          <button
            class="orders-refresh"
            type="button"
            onclick="loadCustomerOrders()"
          >
            Refresh
          </button>
        </div>

        <div id="ordersList" class="orders-list" aria-live="polite">
          <div class="order-empty">Loading your orders...</div>
        </div>
      </section>
    </div>

  </div>

</main>

<script>
  function safeNextUrl() {
    const params =
      new URLSearchParams(
        window.location.search
      );

    const next =
      String(
        params.get("next") || ""
      );

    if (
      next.startsWith("/") &&
      !next.startsWith("//")
    ) {
      return next;
    }

    return "";
  }


  function showTab(tab) {

    const login =
      tab === "login";

    document
      .getElementById("loginTab")
      .classList
      .toggle("active", login);

    document
      .getElementById("registerTab")
      .classList
      .toggle("active", !login);

    document
      .getElementById("loginPanel")
      .classList
      .toggle("active", login);

    document
      .getElementById("registerPanel")
      .classList
      .toggle("active", !login);
  }


  function setMessage(
    elementId,
    text,
    type
  ) {

    const element =
      document.getElementById(
        elementId
      );

    element.textContent =
      text || "";

    element.className =
      "message " + (type || "");
  }


  function showGuest() {

    document
      .getElementById("loadingState")
      .style.display =
        "none";

    document
      .getElementById("guestArea")
      .style.display =
        "block";

    document
      .getElementById("profileArea")
      .classList
      .remove("active");
  }


  function formatRupees(value) {
    const amount = Number(value || 0);

    return "₹" +
      amount.toLocaleString("en-IN", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
  }


  function formatOrderDate(value) {
    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
      return "Date unavailable";
    }

    return date.toLocaleString("en-IN", {
      dateStyle: "medium",
      timeStyle: "short"
    });
  }


  function orderStatusText(value) {
    const status =
      String(value || "created")
        .replace(/_/g, " ");

    return status.charAt(0).toUpperCase() +
      status.slice(1);
  }


  function showOrdersMessage(text, type) {
    const list =
      document.getElementById("ordersList");

    const message =
      document.createElement("div");

    message.className =
      "order-empty" +
      (type === "error" ? " error" : "");

    message.textContent = text;
    list.replaceChildren(message);
  }


  function renderCustomerOrders(orders) {
    const list =
      document.getElementById("ordersList");

    list.replaceChildren();

    if (!Array.isArray(orders) || !orders.length) {
      showOrdersMessage(
        "You have not placed any orders yet.",
        ""
      );
      return;
    }

    orders.forEach(order => {
      const card =
        document.createElement("article");
      card.className = "order-card";

      const head =
        document.createElement("div");
      head.className = "order-head";

      const details =
        document.createElement("div");

      const id =
        document.createElement("div");
      id.className = "order-id";
      id.textContent =
        "Order #" + String(order.id || "-");

      const meta =
        document.createElement("div");
      meta.className = "order-meta";
      meta.textContent =
        formatOrderDate(order.createdAt) +
        " · Total " +
        formatRupees(order.amount);

      details.append(id, meta);

      const status =
        document.createElement("span");
      status.className = "order-status";
      status.dataset.status =
        String(order.status || "created")
          .toLowerCase();
      status.textContent =
        orderStatusText(order.status);

      head.append(details, status);
      card.append(head);

      const itemsWrap =
        document.createElement("div");
      itemsWrap.className = "order-items";

      const items =
        Array.isArray(order.items)
          ? order.items
          : [];

      if (!items.length) {
        const item =
          document.createElement("div");
        item.className = "order-item";
        item.textContent =
          "No item details available.";
        itemsWrap.append(item);
      } else {
        items.forEach(orderItem => {
          const row =
            document.createElement("div");
          row.className = "order-item";

          const name =
            document.createElement("span");
          const quantity =
            Math.max(
              1,
              Number(orderItem.quantity || 1)
            );
          name.textContent =
            String(orderItem.name || "Item") +
            " × " + quantity;

          const price =
            document.createElement("strong");
          price.textContent =
            formatRupees(
              Number(orderItem.price || 0) *
              quantity
            );

          row.append(name, price);
          itemsWrap.append(row);
        });
      }

      card.append(itemsWrap);
      list.append(card);
    });
  }


  async function loadCustomerOrders() {
    showOrdersMessage("Loading your orders...", "");

    try {
      const response =
        await fetch("/api/customer/orders", {
          credentials: "same-origin"
        });

      const data =
        await response.json();

      if (!response.ok) {
        throw new Error(
          data.error ||
          "Could not load your orders."
        );
      }

      renderCustomerOrders(data.orders);
    } catch (error) {
      console.error(error);
      showOrdersMessage(
        error.message ||
          "Could not load your orders.",
        "error"
      );
    }
  }

  function showProfile(customer) {

    document
      .getElementById("loadingState")
      .style.display =
        "none";

    document
      .getElementById("guestArea")
      .style.display =
        "none";

    document
      .getElementById("profileArea")
      .classList
      .add("active");

    document
      .getElementById("welcomeName")
      .textContent =
        "Welcome, " +
        (customer.name || "Customer");

    document
      .getElementById("profileName")
      .textContent =
        customer.name || "-";

    document
      .getElementById("profileEmail")
      .textContent =
        customer.email || "-";

    document
      .getElementById("profilePhone")
      .textContent =
        customer.phone || "-";

    const next =
      safeNextUrl();

    const link =
      document.getElementById(
        "continueLink"
      );

    if (next) {
      link.href =
        next;

      link.textContent =
        "Continue to Checkout";
    } else {
      link.href =
        "/";

      link.textContent =
        "Continue Shopping";
    }

    loadCustomerOrders();
  }


  async function checkCustomer() {

    try {

      const response =
        await fetch(
          "/api/customer/me",
          {
            credentials:
              "same-origin"
          }
        );

      const data =
        await response.json();

      if (
        response.ok &&
        data.authenticated &&
        data.customer
      ) {

        showProfile(
          data.customer
        );

        return;
      }

    } catch (error) {
      console.error(error);
    }

    showGuest();
  }


  document
    .getElementById("loginForm")
    .addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const button =
          document.getElementById(
            "loginButton"
          );

        setMessage(
          "loginMessage",
          "",
          ""
        );

        button.disabled =
          true;

        button.textContent =
          "LOGGING IN...";

        try {

          const response =
            await fetch(
              "/api/customer/login",
              {
                method:
                  "POST",

                credentials:
                  "same-origin",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    email:
                      document
                        .getElementById(
                          "loginEmail"
                        )
                        .value
                        .trim(),

                    password:
                      document
                        .getElementById(
                          "loginPassword"
                        )
                        .value
                  })
              }
            );

          const data =
            await response.json();

          if (!response.ok) {
            throw new Error(
              data.error ||
              "Login failed."
            );
          }

          const next =
            safeNextUrl();

          if (next) {
            window.location.href =
              next;

            return;
          }

          showProfile(
            data.customer
          );

        } catch (error) {

          setMessage(
            "loginMessage",
            error.message ||
              "Login failed.",
            "error"
          );

        } finally {

          button.disabled =
            false;

          button.textContent =
            "LOGIN";
        }
      }
    );


  document
    .getElementById("registerForm")
    .addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const password =
          document
            .getElementById(
              "registerPassword"
            )
            .value;

        const confirmPassword =
          document
            .getElementById(
              "registerConfirmPassword"
            )
            .value;

        if (
          password !==
          confirmPassword
        ) {

          setMessage(
            "registerMessage",
            "Passwords do not match.",
            "error"
          );

          return;
        }

        const button =
          document.getElementById(
            "registerButton"
          );

        setMessage(
          "registerMessage",
          "",
          ""
        );

        button.disabled =
          true;

        button.textContent =
          "CREATING ACCOUNT...";

        try {

          const response =
            await fetch(
              "/api/customer/register",
              {
                method:
                  "POST",

                credentials:
                  "same-origin",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    name:
                      document
                        .getElementById(
                          "registerName"
                        )
                        .value
                        .trim(),

                    phone:
                      document
                        .getElementById(
                          "registerPhone"
                        )
                        .value
                        .trim(),

                    email:
                      document
                        .getElementById(
                          "registerEmail"
                        )
                        .value
                        .trim(),

                    password:
                      password
                  })
              }
            );

          const data =
            await response.json();

          if (!response.ok) {
            throw new Error(
              data.error ||
              "Could not create account."
            );
          }

          const next =
            safeNextUrl();

          if (next) {
            window.location.href =
              next;

            return;
          }

          showProfile(
            data.customer
          );

        } catch (error) {

          setMessage(
            "registerMessage",
            error.message ||
              "Could not create account.",
            "error"
          );

        } finally {

          button.disabled =
            false;

          button.textContent =
            "CREATE ACCOUNT";
        }
      }
    );


  async function logoutCustomer() {

    setMessage(
      "profileMessage",
      "Logging out...",
      ""
    );

    try {

      await fetch(
        "/api/customer/logout",
        {
          method:
            "POST",

          credentials:
            "same-origin"
        }
      );

    } catch (error) {
      console.error(error);
    }

    window.location.href =
      "/account.html";
  }


  checkCustomer();
</script>

</body>
</html>
