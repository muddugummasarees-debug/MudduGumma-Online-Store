<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Checkout | MudduGumma Women's Wear</title>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#fffaf7;
      color:#3c2330;
    }

    header{
      background:#fff;
      border-bottom:1px solid #eadde1;
      padding:20px 7%;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .brand{
      font-size:28px;
      font-weight:700;
      color:#a90f48;
    }

    .back{
      text-decoration:none;
      color:#a90f48;
      font-weight:600;
    }

    .checkout-wrapper{
      max-width:1150px;
      margin:45px auto;
      padding:0 20px;
      display:grid;
      grid-template-columns:1.2fr .8fr;
      gap:35px;
    }

    .box{
      background:#fff;
      border:1px solid #eadde1;
      border-radius:18px;
      padding:28px;
      box-shadow:0 10px 35px rgba(80,20,45,.06);
    }

    h1{
      color:#a90f48;
      margin-top:0;
    }

    h2{
      color:#780b35;
      margin-top:0;
      font-size:22px;
    }

    label{
      display:block;
      font-weight:600;
      margin-bottom:7px;
      font-size:14px;
    }

    input,
    textarea{
      width:100%;
      border:1px solid #ddd;
      border-radius:9px;
      padding:13px;
      font-size:15px;
      margin-bottom:18px;
    }

    textarea{
      min-height:90px;
      resize:vertical;
    }

    .two{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    .order-item{
      display:flex;
      gap:15px;
      border-bottom:1px solid #eee;
      padding:15px 0;
    }

    .order-item img{
      width:75px;
      height:95px;
      object-fit:cover;
      border-radius:8px;
    }

    .order-item h3{
      margin:0 0 7px;
      font-size:15px;
    }

    .price{
      color:#a90f48;
      font-weight:700;
    }

    .summary-row{
      display:flex;
      justify-content:space-between;
      padding:11px 0;
    }

    .total{
      border-top:2px solid #eee;
      margin-top:10px;
      padding-top:18px;
      font-size:21px;
      font-weight:700;
      color:#a90f48;
    }

    .payment-box{
      background:#fff5f8;
      border:1px solid #f0ced9;
      padding:16px;
      border-radius:10px;
      margin:20px 0;
    }

    .payment-box strong{
      color:#a90f48;
    }

    .pay-button{
      width:100%;
      border:0;
      background:#a90f48;
      color:white;
      padding:16px;
      border-radius:10px;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
    }

    .pay-button:hover{
      background:#780b35;
    }

    .pay-button:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    .secure{
      text-align:center;
      color:#777;
      font-size:12px;
      margin-top:12px;
    }

    .message{
      margin-top:14px;
      font-size:13px;
      text-align:center;
      line-height:1.5;
    }

    .error{
      color:#b32643;
    }

    .success{
      color:#247649;
    }

    .empty{
      padding:25px 0;
      text-align:center;
      color:#777;
    }

    @media(max-width:800px){
      .checkout-wrapper{
        grid-template-columns:1fr;
      }

      .two{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="brand">MudduGumma</div>
  <a class="back" href="/">← Continue Shopping</a>
</header>

<div class="checkout-wrapper" id="checkoutWrapper">

  <section class="box">

    <h1>Checkout</h1>
    <h2>Delivery Details</h2>

    <form id="checkoutForm">

      <label>Full Name *</label>
      <input id="customerName" type="text" required>

      <div class="two">

        <div>
          <label>Mobile Number *</label>
          <input
            id="mobile"
            type="tel"
            maxlength="10"
            inputmode="numeric"
            required
          >
        </div>

        <div>
          <label>Email Address *</label>
          <input
            id="email"
            type="email"
            required
          >
        </div>

      </div>

      <label>Delivery Address *</label>
      <textarea
        id="address"
        placeholder="House number, street, area"
        required
      ></textarea>

      <div class="two">

        <div>
          <label>City *</label>
          <input id="city" type="text" required>
        </div>

        <div>
          <label>State *</label>
          <input id="state" type="text" required>
        </div>

      </div>

      <div class="two">

        <div>
          <label>PIN Code *</label>
          <input
            id="pincode"
            type="text"
            maxlength="6"
            inputmode="numeric"
            required
          >
        </div>

        <div>
          <label>Country</label>
          <input value="India" readonly>
        </div>

      </div>

    </form>

  </section>

  <aside class="box">

    <h2>Your Order</h2>

    <div id="orderItems"></div>

    <div class="summary-row">
      <span>Subtotal</span>
      <strong id="subtotal">₹0</strong>
    </div>

    <div class="summary-row">
      <span>Delivery</span>
      <strong>FREE</strong>
    </div>

    <div class="summary-row total">
      <span>Total</span>
      <span id="total">₹0</span>
    </div>

    <div class="payment-box">
      <strong>Online Payment Only</strong>
      <p>
        Pay securely through Razorpay.
        Cash on Delivery is not available.
      </p>
    </div>

    <button
      id="payButton"
      class="pay-button"
      type="button"
      onclick="continuePayment()"
    >
      PROCEED TO ONLINE PAYMENT
    </button>

    <div class="secure">
      🔒 Secure Online Checkout
    </div>

    <div id="paymentMessage" class="message"></div>

  </aside>

</div>

<script>

let cart = [];

try{
  cart =
    JSON.parse(
      localStorage.getItem("muddugummaCart") || "[]"
    );
}catch(e){
  cart = [];
}


function escapeHTML(value){
  return String(value || "")
    .replace(/[&<>"']/g,function(character){

      const map = {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      };

      return map[character];

    });
}


function money(value){

  return "₹" +
    Number(value || 0)
      .toLocaleString("en-IN");

}


function showMessage(text,type){

  const message =
    document.getElementById("paymentMessage");

  message.textContent = text;

  message.className =
    "message " + (type || "");

}


function renderOrder(){

  const orderItems =
    document.getElementById("orderItems");

  let subtotal = 0;


  if(!cart.length){

    orderItems.innerHTML =
      '<div class="empty">Your cart is empty.</div>';

    document.getElementById("subtotal")
      .textContent = "₹0";

    document.getElementById("total")
      .textContent = "₹0";

    return;

  }


  orderItems.innerHTML =
    cart.map(function(item){

      const qty =
        Number(
          item.quantity ||
          item.qty ||
          1
        );

      const price =
        Number(
          item.price ||
          0
        );

      subtotal +=
        price * qty;

      const image =
        item.image ||
        (
          item.images &&
          item.images[0]
        ) ||
        "";

      const variantText =
        [
          item.color ? "Color: " + item.color : "",
          item.size ? "Size: " + item.size : ""
        ]
          .filter(Boolean)
          .join(" · ");


      return `

        <div class="order-item">

          ${
            image
              ? `<img src="${escapeHTML(image)}" alt="">`
              : ""
          }

          <div>

            <h3>
              ${escapeHTML(
                item.name ||
                "MudduGumma Product"
              )}
            </h3>

            ${
              variantText
                ? `<div style="margin:5px 0;color:#7a5968;font-size:13px;">${escapeHTML(variantText)}</div>`
                : ""
            }

            <div>
              Qty: ${qty}
            </div>

            <div class="price">
              ${money(price * qty)}
            </div>

          </div>

        </div>

      `;

    }).join("");


  document.getElementById("subtotal")
    .textContent =
      money(subtotal);

  document.getElementById("total")
    .textContent =
      money(subtotal);

}


function getCustomer(){

  return {

    name:
      document
        .getElementById("customerName")
        .value
        .trim(),

    mobile:
      document
        .getElementById("mobile")
        .value
        .trim(),

    email:
      document
        .getElementById("email")
        .value
        .trim(),

    address:
      document
        .getElementById("address")
        .value
        .trim(),

    city:
      document
        .getElementById("city")
        .value
        .trim(),

    state:
      document
        .getElementById("state")
        .value
        .trim(),

    pincode:
      document
        .getElementById("pincode")
        .value
        .trim()

  };

}


function validateCustomer(customer){

  if(
    !customer.name ||
    !customer.mobile ||
    !customer.email ||
    !customer.address ||
    !customer.city ||
    !customer.state ||
    !customer.pincode
  ){
    return "Please fill in all delivery details.";
  }


  if(
    !/^[0-9]{10}$/.test(
      customer.mobile
    )
  ){
    return "Please enter a valid 10-digit mobile number.";
  }


  if(
    !/^[0-9]{6}$/.test(
      customer.pincode
    )
  ){
    return "Please enter a valid 6-digit PIN code.";
  }


  return "";

}


async function continuePayment(){

  const form =
    document.getElementById("checkoutForm");

  const button =
    document.getElementById("payButton");


  if(!form.reportValidity()){
    return;
  }


  if(!cart.length){

    showMessage(
      "Your cart is empty.",
      "error"
    );

    return;

  }


  const customer =
    getCustomer();


  const validation =
    validateCustomer(customer);


  if(validation){

    showMessage(
      validation,
      "error"
    );

    return;

  }


  button.disabled = true;

  button.textContent =
    "PREPARING PAYMENT...";


  showMessage(
    "Creating secure payment order...",
    ""
  );


  try{

    const createResponse =
      await fetch(
        "/api/create-order",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              customer:customer,

              items:
                cart.map(
                  function(item){

                    return {

                      id:item.id,

                      quantity:
                        Number(
                          item.quantity ||
                          item.qty ||
                          1
                        ),

                      variantKey:item.variantKey || "",
                      color:item.color || "",
                      size:item.size || ""

                    };

                  }
                )

            })
        }
      );


    const order =
      await createResponse.json();


    if(!createResponse.ok){

      throw new Error(
        order.error ||
        "Could not create payment order."
      );

    }


    if(typeof Razorpay === "undefined"){

      throw new Error(
        "Razorpay Checkout could not load. Please refresh and try again."
      );

    }


    const options = {

      key:
        order.keyId,

      amount:
        order.amount,

      currency:
        order.currency || "INR",

      name:
        "MudduGumma Women's Wear",

      description:
        "MudduGumma Order",

      order_id:
        order.razorpayOrderId,

      prefill:{

        name:
          customer.name,

        email:
          customer.email,

        contact:
          customer.mobile

      },

      theme:{
        color:"#a90f48"
      },


      handler:
        async function(paymentResponse){

          button.disabled = true;

          button.textContent =
            "VERIFYING PAYMENT...";


          showMessage(
            "Payment received. Verifying your order...",
            ""
          );


          try{

            const verifyResponse =
              await fetch(
                "/api/verify-payment",
                {
                  method:"POST",

                  headers:{
                    "Content-Type":
                      "application/json"
                  },

                  body:
                    JSON.stringify({

                      razorpay_payment_id:
                        paymentResponse
                          .razorpay_payment_id,

                      razorpay_order_id:
                        paymentResponse
                          .razorpay_order_id,

                      razorpay_signature:
                        paymentResponse
                          .razorpay_signature

                    })
                }
              );


            const result =
              await verifyResponse.json();


            if(
              !verifyResponse.ok ||
              !result.ok
            ){

              throw new Error(
                result.error ||
                "Payment verification failed."
              );

            }


            localStorage.removeItem(
              "muddugummaCart"
            );


            cart = [];


            document
              .getElementById(
                "checkoutWrapper"
              )
              .innerHTML = `

                <div
                  class="box"
                  style="
                    grid-column:1/-1;
                    text-align:center;
                    padding:55px 25px;
                  "
                >

                  <div
                    style="
                      font-size:55px;
                      color:#247649;
                    "
                  >
                    ✓
                  </div>

                  <h1>
                    Order Confirmed
                  </h1>

                  <p>
                    Thank you for shopping with MudduGumma.
                  </p>

                  <p>
                    Order ID:
                    <strong>
                      ${escapeHTML(
                        result.orderId
                      )}
                    </strong>
                  </p>

                  <a
                    href="/"
                    style="
                      display:inline-block;
                      margin-top:18px;
                      padding:14px 22px;
                      background:#a90f48;
                      color:white;
                      border-radius:9px;
                      text-decoration:none;
                      font-weight:700;
                    "
                  >
                    CONTINUE SHOPPING
                  </a>

                </div>

              `;

          }catch(error){

            button.disabled = false;

            button.textContent =
              "PROCEED TO ONLINE PAYMENT";


            showMessage(
              error.message ||
              "Could not verify payment.",
              "error"
            );

          }

        },


      modal:{

        ondismiss:function(){

          button.disabled = false;

          button.textContent =
            "PROCEED TO ONLINE PAYMENT";


          showMessage(
            "Payment window closed. You can try again.",
            ""
          );

        }

      }

    };


    const razorpay =
      new Razorpay(options);


    razorpay.on(
      "payment.failed",
      function(response){

        button.disabled = false;

        button.textContent =
          "PROCEED TO ONLINE PAYMENT";


        showMessage(
          response.error &&
          response.error.description
            ? response.error.description
            : "Payment failed. Please try again.",
          "error"
        );

      }
    );


    razorpay.open();


    button.disabled = false;

    button.textContent =
      "PROCEED TO ONLINE PAYMENT";


  }catch(error){

    console.error(error);


    button.disabled = false;

    button.textContent =
      "PROCEED TO ONLINE PAYMENT";


    showMessage(
      error.message ||
      "Could not start payment.",
      "error"
    );

  }

}


renderOrder();

</script>

</body>
</html>
