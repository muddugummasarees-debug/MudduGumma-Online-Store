<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | MudduGumma Women's Wear</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#fffaf7;
      color:#3c2330;
    }

    header{
      background:#ffffff;
      border-bottom:1px solid #eadde1;
      padding:20px 7%;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .brand{
      font-size:28px;
      font-weight:700;
      color:#a90f48;
    }

    .back{
      text-decoration:none;
      color:#a90f48;
      font-weight:600;
    }

    .checkout-wrapper{
      max-width:1150px;
      margin:45px auto;
      padding:0 20px;
      display:grid;
      grid-template-columns:1.2fr .8fr;
      gap:35px;
    }

    .box{
      background:white;
      border:1px solid #eadde1;
      border-radius:18px;
      padding:28px;
      box-shadow:0 10px 35px rgba(80,20,45,.06);
    }

    h1{
      color:#a90f48;
      margin-top:0;
    }

    h2{
      color:#780b35;
      margin-top:0;
      font-size:22px;
    }

    label{
      display:block;
      font-weight:600;
      margin-bottom:7px;
      font-size:14px;
    }

    input, textarea{
      width:100%;
      border:1px solid #ddd;
      border-radius:9px;
      padding:13px;
      font-size:15px;
      margin-bottom:18px;
    }

    textarea{
      min-height:90px;
      resize:vertical;
    }

    .two{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    .order-item{
      display:flex;
      gap:15px;
      border-bottom:1px solid #eee;
      padding:15px 0;
    }

    .order-item img{
      width:75px;
      height:95px;
      object-fit:cover;
      border-radius:8px;
    }

    .order-item h3{
      margin:0 0 7px;
      font-size:15px;
    }

    .price{
      color:#a90f48;
      font-weight:700;
    }

    .summary-row{
      display:flex;
      justify-content:space-between;
      padding:11px 0;
    }

    .total{
      border-top:2px solid #eee;
      margin-top:10px;
      padding-top:18px;
      font-size:21px;
      font-weight:700;
      color:#a90f48;
    }

    .payment-box{
      background:#fff5f8;
      border:1px solid #f0ced9;
      padding:16px;
      border-radius:10px;
      margin:20px 0;
    }

    .payment-box strong{
      color:#a90f48;
    }

    .pay-button{
      width:100%;
      border:0;
      background:#a90f48;
      color:white;
      padding:16px;
      border-radius:10px;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
    }

    .pay-button:hover{
      background:#780b35;
    }

    .secure{
      text-align:center;
      color:#777;
      font-size:12px;
      margin-top:12px;
    }

    .empty{
      padding:25px 0;
      text-align:center;
      color:#777;
    }

    @media(max-width:800px){
      .checkout-wrapper{
        grid-template-columns:1fr;
      }

      .two{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="brand">MudduGumma</div>
  <a class="back" href="/">← Continue Shopping</a>
</header>

<div class="checkout-wrapper">

  <section class="box">

    <h1>Checkout</h1>

    <h2>Delivery Details</h2>

    <form id="checkoutForm">

      <label>Full Name *</label>
      <input id="customerName" type="text" required>

      <div class="two">

        <div>
          <label>Mobile Number *</label>
          <input
            id="mobile"
            type="tel"
            maxlength="10"
            required
          >
        </div>

        <div>
          <label>Email Address *</label>
          <input
            id="email"
            type="email"
            required
          >
        </div>

      </div>

      <label>Delivery Address *</label>
      <textarea
        id="address"
        placeholder="House number, street, area"
        required
      ></textarea>

      <div class="two">

        <div>
          <label>City *</label>
          <input id="city" type="text" required>
        </div>

        <div>
          <label>State *</label>
          <input id="state" type="text" required>
        </div>

      </div>

      <div class="two">

        <div>
          <label>PIN Code *</label>
          <input
            id="pincode"
            type="text"
            maxlength="6"
            required
          >
        </div>

        <div>
          <label>Country</label>
          <input value="India" readonly>
        </div>

      </div>

    </form>

  </section>


  <aside class="box">

    <h2>Your Order</h2>

    <div id="orderItems"></div>

    <div class="summary-row">
      <span>Subtotal</span>
      <strong id="subtotal">₹0</strong>
    </div>

    <div class="summary-row">
      <span>Delivery</span>
      <strong>FREE</strong>
    </div>

    <div class="summary-row total">
      <span>Total</span>
      <span id="total">₹0</span>
    </div>

    <div class="payment-box">
      <strong>Online Payment Only</strong>
      <p>
        Pay securely online. Cash on Delivery is not available.
      </p>
    </div>

    <button
      class="pay-button"
      onclick="continuePayment()"
    >
      PROCEED TO ONLINE PAYMENT
    </button>

    <div class="secure">
      🔒 Secure Online Checkout
    </div>

  </aside>

</div>


<script>

let cart = [];

try{
  cart = JSON.parse(
    localStorage.getItem("muddugummaCart")
  ) || [];
}catch(e){
  cart = [];
}

const orderItems =
  document.getElementById("orderItems");

let subtotal = 0;


function money(value){
  return "₹" +
    Number(value || 0)
      .toLocaleString("en-IN");
}


function renderOrder(){

  if(!cart.length){

    orderItems.innerHTML =
      '<div class="empty">Your cart is empty.</div>';

    document.getElementById("subtotal")
      .textContent = "₹0";

    document.getElementById("total")
      .textContent = "₹0";

    return;
  }


  orderItems.innerHTML =
    cart.map(item => {

      const qty =
        Number(item.qty || item.quantity || 1);

      const price =
        Number(item.price || 0);

      subtotal += price * qty;

      const image =
        item.image ||
        (item.images && item.images[0]) ||
        "";

      return `
        <div class="order-item">

          ${
            image
            ? `<img src="${image}" alt="">`
            : ""
          }

          <div>

            <h3>
              ${item.name || "MudduGumma Product"}
            </h3>

            <div>
              Qty: ${qty}
            </div>

            <div class="price">
              ${money(price * qty)}
            </div>

          </div>

        </div>
      `;

    }).join("");


  document.getElementById("subtotal")
    .textContent = money(subtotal);

  document.getElementById("total")
    .textContent = money(subtotal);
}


function continuePayment(){

  const form =
    document.getElementById("checkoutForm");

  if(!form.reportValidity()){
    return;
  }

  if(!cart.length){
    alert(
      "Your cart is empty. Please add a saree first."
    );
    return;
  }

  const customer = {

    name:
      document.getElementById("customerName").value,

    mobile:
      document.getElementById("mobile").value,

    email:
      document.getElementById("email").value,

    address:
      document.getElementById("address").value,

    city:
      document.getElementById("city").value,

    state:
      document.getElementById("state").value,

    pincode:
      document.getElementById("pincode").value

  };

  localStorage.setItem(
    "muddugummaCustomer",
    JSON.stringify(customer)
  );

  alert(
    "Checkout details saved. Next we will connect your secure online payment gateway."
  );
}


renderOrder();

</script>

</body>
</html>
